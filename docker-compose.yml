services:
  noteselot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://noteselot.130.130.10.18.sslip.io}
      DATABASE_URL: postgres://noteselot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/noteselot
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: noteselot
      POSTGRES_USER: noteselot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - noteselot_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteselot -d noteselot"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
volumes:
  noteselot_data:
